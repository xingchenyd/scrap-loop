<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>废品轮回 Scrap Loop | 公益回收冒险</title>
    <link rel="stylesheet" href="./style.css?v=scraploop8" />
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="废品轮回 Scrap Loop 游戏窗口">
        <canvas id="game" width="1280" height="720"></canvas>

        <div id="titleScreen" class="title-screen">
          <div class="title-copy">
            <p class="eyebrow">公益回收 · 主题关卡 · 3D 废物打印</p>
            <h1>废品轮回 Scrap Loop</h1>
            <p>进入基地，和废品对话，选择电子、塑料、纸板、布料主题关卡。收集碎片升级装备与技能，挑战 Boss 获得打印碎片，兑换公益纪念品。</p>
            <div class="title-actions">
              <button id="startBtn" class="game-button primary">开始游戏 Enter</button>
              <button id="continueBtn" class="game-button">继续存档</button>
              <button id="resetBtn" class="game-button quiet">重置</button>
            </div>
          </div>
        </div>

        <div id="hud" class="hud">
          <div class="hud-left">
            <div class="vital-card hp-card">
              <img src="./assets/sprites/item_heart.png" alt="生命" />
              <div class="vital-info">
                <span class="vital-label">生命</span>
                <strong id="hpText">100/100</strong>
                <div class="vital-bar"><i id="hpFill"></i></div>
              </div>
            </div>
            <div class="vital-card shield-card">
              <img src="./assets/sprites/item_shield.png" alt="护盾" />
              <div class="vital-info">
                <span class="vital-label">护盾</span>
                <strong id="shieldText">0/90</strong>
                <div class="vital-bar"><i id="shieldFill"></i></div>
              </div>
            </div>
          </div>
          <div class="hud-right">
            <div class="resource-card">
              <img src="./assets/sprites/item_badge.png" alt="公益点" />
              <div class="resource-info">
                <span class="resource-label">公益点</span>
                <strong id="pointText">0</strong>
              </div>
            </div>
            <div class="resource-card">
              <img src="./assets/sprites/item_print.png" alt="打印碎片" />
              <div class="resource-info">
                <span class="resource-label">打印碎片</span>
                <strong id="printText">0</strong>
              </div>
            </div>
          </div>
        </div>

        <div id="coachBubble" class="coach-bubble hidden">
          <div class="coach-avatar">
            <img src="./assets/sprites/guide_sprite.png" alt="" />
          </div>
          <div class="coach-copy">
            <strong id="coachTitle">回收向导</strong>
            <p id="coachText"></p>
            <div class="coach-actions">
              <button id="coachNext" class="game-button primary">下一步</button>
              <button id="coachSkip" class="game-button quiet">跳过</button>
            </div>
          </div>
        </div>

        <div id="synthOverlay" class="synth-overlay hidden">
          <div class="synth-stage">
            <div class="synth-portrait">
              <img id="synthResultImg" src="./assets/sprites/facility_workbench.png" alt="" />
            </div>
            <div class="synth-info">
              <h2 id="synthTitle">纪念工坊</h2>
              <p id="synthHint">选中一个配方，按 Enter 或点击合成启动合成台。</p>
              <div class="synth-anvil">
                <div class="anvil-bowl" id="anvilBowl"></div>
                <div class="anvil-hammer" id="anvilHammer"></div>
                <div class="anvil-spark" id="anvilSpark"></div>
              </div>
              <div class="synth-crafting" id="synthCrafting">选择配方后合成</div>
            </div>
            <div class="synth-recipes">
              <h3>可合成纪念品</h3>
              <div id="synthRecipes" class="synth-recipe-list"></div>
            </div>
          </div>
        </div>

        <div id="storyOverlay" class="story-overlay hidden">
          <div class="story-stage">
            <div class="story-portrait">
              <img id="storyPortrait" src="./assets/sprites/char_warden.png" alt="" />
              <span id="storyName">基地引导员</span>
            </div>
            <div class="story-text">
              <p id="storyDialogue">点击“开始”听废品讲述自己的故事。</p>
              <p class="story-fact"><b>知识点：</b><span id="storyFact"></span></p>
              <div class="story-choices">
                <button id="storyRespond" class="game-button primary">回应它</button>
                <button id="storyContinue" class="game-button">下一段对话</button>
                <button id="storyClose" class="game-button quiet">关闭 Esc</button>
              </div>
            </div>
          </div>
        </div>

        <div id="quizOverlay" class="story-overlay hidden">
          <div class="story-stage">
            <div class="story-portrait">
              <img id="quizPortrait" src="./assets/sprites/facility_terminal.png" alt="" />
              <span id="quizName">知识问答</span>
            </div>
            <div class="story-text">
              <p id="quizQuestion">加载中...</p>
              <div id="quizOptions" class="quiz-options"></div>
              <p id="quizResult" class="story-fact" style="display:none"></p>
              <div class="story-choices">
                <button id="quizNext" class="game-button primary" style="display:none">下一题</button>
                <button id="quizClose" class="game-button quiet">关闭 Esc</button>
              </div>
            </div>
          </div>
        </div>

        <div class="mobile-pad" aria-label="触控按钮">
          <div class="pad-grid">
            <button data-pad="up">▲</button>
            <button data-pad="left">◀</button>
            <button data-pad="down">▼</button>
            <button data-pad="right">▶</button>
          </div>
          <div class="pad-actions">
            <button data-action="attack">攻击</button>
            <button data-action="skill">技能</button>
            <button data-action="interact">互动</button>
          </div>
        </div>

        <section id="modal" class="modal hidden" aria-live="polite"></section>
        <div id="toast" class="toast hidden"></div>
      </section>
    </main>
    <script src="./main.js?v=scraploop8"></script>
  </body>
</html>
